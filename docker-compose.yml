services:
  thatkitebot:
    build:
      context: .
      dockerfile: ./Dockerfile
    depends_on:
      - redis
      - redis_cache

    volumes:
      - ./thatkitebot/:/app/thatkitebot
      - ./data/:/app/data/
      - ./trains/:/app/data/trains/
      - ./.git/:/app/.git
      - ./logs/:/var/log/thatkitebot/
      - ./config/policy.xml:/etc/ImageMagick-6/policy.xml
    restart:  "no"
    environment:
      - PYTHONUNBUFFERED=1
      - KITEBOT_DEBUG=0
      - DISCORD_DEBUG=0
      - ENCRYPT_MESSAGE_CACHE=1
    ulimits:
      # memfd_secret uses the locked memory allowance, 64kb is enough for the key
      memlock:
        soft: 65536
        hard: 65536
      # Disable crash dumps, which could leak the encryption key
      core:
        soft: 0
        hard: 0
    command: bash -c "cd /app/ && /app/thatkitebot-venv/bin/python3 -m thatkitebot"

  redis:
    container_name: thatkitebot_redis
    volumes:
      - ./data/redis:/data
    image: "valkey/valkey:alpine"
    entrypoint: valkey-server --appendonly yes --hz 50

  redis_cache:
    container_name: thatkitebot_redis_cache
    image: "valkey/valkey:alpine"
    entrypoint: valkey-server --save "" --appendonly no --hz 50
